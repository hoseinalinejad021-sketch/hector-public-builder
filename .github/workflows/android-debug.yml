name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradlew'
      - 'gradle/**'
      - 'app/**'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check for Android Gradle project
        shell: bash
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "::error::No Gradle wrapper (./gradlew) found. This template repository does not contain the Hector app source. Do not upload private source or signing keys to this public repository."
            exit 1
          fi
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "::error::No settings.gradle or settings.gradle.kts found. A complete Android Gradle project is required."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Hector-debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
